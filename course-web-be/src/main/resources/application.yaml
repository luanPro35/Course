server:
  port: 8080
  servlet:
    context-path: /project
spring:
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    retry:
      max-attempts: 3 # Chỉnh về 1 để test lỗi nhanh hơn
      backoff:
        initialInterval: 2s  # Thời gian chờ giữa các lần thử
        max-interval: 5s
    openai:
      api-key: ${GEMINI_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com
        completions-path: /v1beta/openai/chat/completions
    #      embedding:
    #        base-url: https://api.openai.com
    #        embeddings-path: /v1/embeddings
    #        options:
    #          model: gemini-2.5-flash
    ollama:
      embedding:
        options:
          model: embeddinggemma:latest
      base-url: http://localhost:11434
      chat:
  #        options:
  #          model: qwen2.5:latest
  #          temperature: 0.7
  profiles:
    active: dev
  application:
    name: course-web-be
  datasource:
    url: ${SQL_URL}
    username: ${USER_NAME}
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  ## limit file size
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  data:
    redis:
      #      host: ${REDIS_HOST}
      #      port: ${REDIS_PORT}
      lecture:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-await: 1000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      group-id: course-web-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  main:
    allow-bean-definition-overriding: true
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
jwt:
  secret-key: ${SECRET_KEY}
  access-token-expiration: ${ACCESS_TOKEN_EX}
  refresh-token-expiration: ${REFRESH_TOKEN_EX}
aws:
  region: us-east-1
  s3:
    bucket-name: ${BUCKET_NAME}
  credentials:
    access-key: ${ACCESS_KEY}
    secret-key: ${SECRET_ACCESS_KEY}
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  grant-type: "authorization_code"

vnpay:
  tmnCode: ${VNPAY_TMNCODE}
  hashSecret: ${VNPAY_HASHSECRET}
  url: ${VNPAY_URL}
  returnUrl: ${VNPAY_RETURNURL}
  apiUrl: ${VNPAY_APIURL}

notification:
  email:
    url: ${BREVO_URL}
    api-key: ${BREVO_API_KEY}
  sender:
    name: ${SENDER_NAME}
    email: ${SENDER_EMAIL}
